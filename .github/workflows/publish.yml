name: publish

# 推送 v* 标签时发布；也可以在 Actions 页面手动触发。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bilibili-api-ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: bilibili-api-ts/package-lock.json

      - run: npm ci

      # 标签发布时要求 vX.Y.Z 与 package.json 的 version 一致，避免错版。
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const expected=process.env.GITHUB_REF_NAME.replace(/^v/,''); const actual=require('./package.json').version; if(actual!==expected){console.error('tag='+expected+' package='+actual);process.exit(1)}"

      # npm publish 的 prepublishOnly 还会再跑一次测试；这里显式跑一遍便于在 CI 日志定位。
      - run: npm test

      - run: npm pack --dry-run

      # NPM_TOKEN 需要在仓库 Settings → Secrets and variables → Actions 中配置。
      # 必须使用带 Bypass 2FA 的 Granular Access Token（Read and write，All packages）。
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
