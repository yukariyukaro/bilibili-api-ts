name: publish

# 推送 v* 标签时发布；也可以在 Actions 页面手动触发。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bilibili-api-ts
    steps:
      - uses: actions/checkout@v4

      # 注意：这里刻意不设置 registry-url。
      # setup-node 的 registry-url 会写入 .npmrc 里的
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # 当 NPM_TOKEN 未配置时它会变成空凭证，npm 因此不会走 OIDC，
      # 表现为「publish 失败但看不出原因」。trusted publishing 必须让 npm 自己取 OIDC。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bilibili-api-ts/package-lock.json

      # Trusted publishing 需要 npm >= 11.5.1。
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.15.0
          npm --version

      - run: npm ci

      # 标签发布时要求 vX.Y.Z 与 package.json 的 version 一致，避免错版。
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const expected=process.env.GITHUB_REF_NAME.replace(/^v/,''); const actual=require('./package.json').version; if(actual!==expected){console.error('tag='+expected+' package='+actual);process.exit(1)}"

      # 确认 OIDC 通道可用，并且本地没有残留的 _authToken 干扰。
      # 关键诊断：GitHub 是否真的注入了 OIDC 端点，以及本地有没有残留 .npmrc。
      - name: Show auth environment
        run: |
          echo "::notice title=OIDC URL::${ACTIONS_ID_TOKEN_REQUEST_URL:+present}${ACTIONS_ID_TOKEN_REQUEST_URL:-absent}"
          echo "::notice title=OIDC TOKEN::${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-absent}"
          echo "::notice title=npm::version=$(npm --version) registry=$(npm config get registry)"
          echo "::notice title=NODE_AUTH_TOKEN::${NODE_AUTH_TOKEN:+present}${NODE_AUTH_TOKEN:-absent}"
          if [ -f .npmrc ]; then echo "::notice title=npmrc::$(sed -E 's/(_authToken=).*/\1***/' .npmrc | tr '\n' ' ')"; else echo "::notice title=npmrc::none"; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm publish 的 prepublishOnly 还会再跑一次测试；这里显式跑一遍便于在 CI 日志定位。
      - run: npm test

      - run: npm pack --dry-run

      # 失败时把 npm 的报错写成 annotation：没有 Actions 日志权限时也能定位原因。
      - name: Publish (trusted publishing / OIDC)
        shell: bash
        run: |
          set -o pipefail
          if npm publish --access public --provenance 2>&1 | tee publish.log; then
            echo "::notice title=npm publish::ok"
          else
            code=$?
            echo "::error title=npm publish 失败，退出码::$code"
            echo "::error title=npm 环境::registry=$(npm config get registry) npm=$(npm --version)"
            grep -m 8 -E "(npm error|ERR!|error code|EOTP|E401|ENEEDAUTH|403|404|provenance|trusted)" publish.log \
              | sed -E 's/(_authToken=)[^ ]*/\1***/g' \
              | while IFS= read -r line; do echo "::error title=npm error::$line"; done
            exit "$code"
          fi
