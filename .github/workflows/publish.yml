name: publish

# 推送 v* 标签时发布；也可以在 Actions 页面手动触发。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bilibili-api-ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: bilibili-api-ts/package-lock.json

      # Trusted publishing 需要 npm >= 11.5.1；这里固定到支持 npm trust 的 11.15.x。
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.15.0

      - run: npm ci

      # 标签发布时要求 vX.Y.Z 与 package.json 的 version 一致，避免错版。
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const expected=process.env.GITHUB_REF_NAME.replace(/^v/,''); const actual=require('./package.json').version; if(actual!==expected){console.error('tag='+expected+' package='+actual);process.exit(1)}"

      # npm publish 的 prepublishOnly 还会再跑一次测试；这里显式跑一遍便于在 CI 日志定位。
      - run: npm test

      - run: npm pack --dry-run

      # 先确认走哪条认证路径：配了 NPM_TOKEN 就用 token，否则交给 trusted publishing(OIDC)。
      - name: Detect npm auth method
        id: auth
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
            echo "使用 NPM_TOKEN"
            npm whoami
          else
            echo "method=oidc" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 NPM_TOKEN，改用 trusted publishing(OIDC)；需在 npmjs.com 为该包配置 GitHub 信任的发布者"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # NPM_TOKEN：带 Bypass 2FA 的 Granular Access Token（Read and write，All packages）。
      - name: Publish with token
        if: steps.auth.outputs.method == 'token'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish with trusted publishing
        if: steps.auth.outputs.method == 'oidc'
        run: npm publish --access public --provenance
